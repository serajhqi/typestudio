<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Typography icon: Elegant "T" serif with baseline bar -->
  <g filter="url(#glow)">
    <!-- Main serif T letterform -->
    <path
      d="M19 19.5 C19 18.5 20 18 21.5 18 H42.5 C44 18 45 18.5 45 19.5 C45 20.8 44 21.5 42 21.8 L36 22.2 V43.5 C36 45 37 45.5 39 45.8 C39.5 45.9 40 46.5 40 47 C40 47.6 39.5 48 38.5 48 H25.5 C24.5 48 24 47.6 24 47 C24 46.5 24.5 45.9 25 45.8 C27 45.5 28 45 28 43.5 V22.2 L22 21.8 C20 21.5 19 20.8 19 19.5 Z"
      fill="url(#glyphGrad)"
    />

    <!-- Font baseline cursor / accent sparkle dot -->
    <circle cx="45" cy="46" r="2.5" fill="#38bdf8" />
  </g>
</svg>